name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        flags:
          - ""
          - "--no-default-features"
          - "--no-default-features --features native-picker"
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - run: cargo fmt --all -- --check
      - run: cargo build --release ${{ matrix.flags }}
      - run: cargo test --release ${{ matrix.flags }}
      - run: cargo clippy --all-targets ${{ matrix.flags }} -- -D warnings
      - name: Reject conflicting picker features
        if: matrix.flags == '--no-default-features --features native-picker'
        run: |
          if cargo check --features native-picker > conflict.log 2>&1; then
            cat conflict.log
            exit 1
          fi
          grep -F 'picker and native-picker are mutually exclusive' conflict.log
